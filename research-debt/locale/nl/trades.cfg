[mod-setting-name]
rd-enable-trades=Ruilopties inschakelen (labsnelheid, evolution, vergeten)

[mod-setting-description]
rd-enable-trades=Voegt drie extra manieren toe om de multiplier te verlagen in het Kennisschuld-venster: labs vertragen, vijandelijke evolution verhogen of een technologie vergeten.

[research-debt]
gui-row-trades=Ruilopties (labs, evolution)
gui-trade-lab-title=[img=utility/clock] Tijd ruilen voor kennis
gui-trade-lab-text=Maak alle labs van je force __1__ langzamer voor elke __2__ schuld die wordt verwijderd. Je kunt dit altijd tegen hetzelfde tarief terugdraaien; je ruilt dus science packs voor onderzoekstijd.
gui-trade-lab-status=Labs zijn nu __1__ langzamer door ruil (__2__ van __3__ stappen). Labsnelheid-modifier: __4__.
gui-trade-lab-slow=Labs −__1__ → −__2__ schuld
gui-trade-lab-restore=Herstel +__1__ → +__2__ schuld
gui-trade-evo-title=[img=entity/biter-spawner] Voer de vijand
gui-trade-evo-text=Verhoog de vijandelijke evolution op je huidige surface met __1__ voor elke __2__ schuld die wordt verwijderd. Dit is niet terug te draaien.
gui-trade-evo-status=Evolution op __1__: __2__.
gui-trade-evo-max=Evolution is al __1__ of hoger; hier is niets meer te ruilen.
gui-trade-evo-none=Er is geen vijandelijke force in dit spel.
gui-trade-evo-button=+__1__ evolution → −__2__ schuld
gui-trade-forget-title=[img=utility/trash] Een technologie vergeten
gui-trade-forget-text=Maak het onderzoek ongedaan van een technologie waar niets anders van afhangt. Je verliest de recepten en bonussen en krijgt precies de schuld terug die zij toevoegde (haar science-tier bepaalt hoeveel). Wil je haar terug, dan betaal je de volledige kosten opnieuw.
gui-trade-forget-none=Er kan nu niets vergeten worden.
gui-trade-forget-button=Geselecteerde technologie vergeten
gui-trade-nodebt=Er is nu geen schuld om af te lossen.
gui-log-trade=Ruil (__1__) → __2__
msg-trade-lab=[color=green][Kennisschuld][/color] Labs zijn nu __1__ langzamer; schuld −__2__. Onderzoek kost nu [font=default-bold]×__3__[/font].
msg-trade-lab-undo=[color=orange][Kennisschuld][/color] Labsnelheid hersteld met __1__; schuld +__2__. Onderzoek kost nu [font=default-bold]×__3__[/font].
msg-trade-evo=[color=green][Kennisschuld][/color] Evolution op __1__ verhoogd naar __2__; schuld −__3__. Onderzoek kost nu [font=default-bold]×__4__[/font].
msg-forget=[color=green][Kennisschuld][/color] __1__ is vergeten; schuld −__2__. Onderzoek kost nu [font=default-bold]×__3__[/font].
msg-trade-failed=[color=red][Kennisschuld][/color] Die ruil is nu niet mogelijk (__1__).
