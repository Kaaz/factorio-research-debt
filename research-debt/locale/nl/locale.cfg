[mod-name]
research-debt=Kennisschuld

[mod-description]
research-debt=Elke niet-oneindige technologie die je onderzoekt verhoogt een globale onderzoekskosten-multiplier. Los de schuld af met Kennisconsolidatie-onderzoek of door waardevolle items te offeren in een Archief.

[mod-setting-name]
rd-growth-mode=Groeimodus
rd-step=Schuld per technologie
rd-count-trigger-techs=Trigger-technologieën meetellen
rd-enable-archive=Archief-gebouw inschakelen
rd-consolidation-value=Schuld per level Kennisconsolidatie
rd-max-multiplier=Maximale onderzoekskosten-multiplier
rd-min-multiplier=Minimale multiplier (t.o.v. map-instelling)
rd-chat-notifications=Chatmeldingen bij schuldwijzigingen
rd-show-hud=Toon onderzoekskosten-HUD

[mod-setting-description]
rd-growth-mode=Lineair: multiplier = basis × (1 + schuld). Exponentieel: elke technologie vermenigvuldigt de kosten met (1 + stap).
rd-step=Hoeveel schuld elke onderzochte (niet-oneindige) technologie toevoegt. 0.1 betekent +10% onderzoekskosten per technologie in lineaire modus. Wordt genegeerd tenzij de preset Custom is.
rd-count-trigger-techs=Technologieën die door een trigger worden vrijgespeeld (iets maken of delven) hebben geen science-kosten. Toch als schuld meetellen?
rd-enable-archive=Voegt het Archief toe: een kist die waardevolle items verbruikt om kennisschuld af te lossen.
rd-consolidation-value=Elk level van het oneindige onderzoek Kennisconsolidatie verwijdert zoveel schuld. Wordt genegeerd tenzij de preset Custom is.
rd-max-multiplier=De onderzoekskosten-multiplier komt nooit boven deze waarde, hoeveel schuld er ook is. Wordt genegeerd tenzij de preset Custom is.
rd-min-multiplier=De multiplier zakt nooit onder basis × deze waarde. 1.0 betekent dat onderzoek nooit goedkoper wordt dan de map-instelling.
rd-chat-notifications=Toon een kort chatbericht bij elke schuldwijziging.
rd-show-hud=Toont de huidige onderzoekskosten-multiplier bovenaan het scherm. Klik erop voor details.

[mod-setting-string-value]
rd-growth-mode-linear=Lineair
rd-growth-mode-exponential=Exponentieel

[research-debt]
cmd-status=Toon kennisschuld, basis en huidige multiplier.
cmd-recalc=(admin) Herbereken de schuld uit de tot nu toe onderzochte technologieën.
cmd-reset=(admin) Zet de kennisschuld op nul.
admin-only=[Kennisschuld] Dit commando is alleen voor admins.
msg-research=[color=orange][Kennisschuld][/color] __1__ voegt __2__ schuld toe. Onderzoek kost nu [font=default-bold]×__3__[/font].
msg-consolidation=[color=green][Kennisschuld][/color] Kennisconsolidatie verwijderde __1__ schuld. Onderzoek kost nu [font=default-bold]×__2__[/font].

[technology-name]
rd-consolidation-green=Kennisconsolidatie I
rd-consolidation-blue=Kennisconsolidatie II
rd-consolidation-yellow=Kennisconsolidatie III
rd-consolidation-space=Kennisconsolidatie IV
rd-archive=Archief

[technology-description]
rd-consolidation=Trap __1__ van __2__. Herorganiseer wat je al weet: elk level verwijdert een deel van de kennisschuld en verlaagt de onderzoekskosten-multiplier. Wordt zelf nooit duurder door de multiplier, maar elk level kost meer dan het vorige. De volgende trap ontgrendelen vervangt deze; trap I tot III hebben een beperkt aantal levels, trap IV is oneindig.
rd-archive=Ontgrendelt het Archief, een kist die waardevolle items permanent verbruikt om kennisschuld af te lossen. Items worden minder waard naarmate je al meer gearchiveerd hebt.

[technology-effect]
rd-consolidation=Verwijdert kennisschuld (zie het Kennisschuld-venster, Ctrl+K)

[entity-name]
rd-archive=Archief

[entity-description]
rd-archive=Items met onderzoekswaarde die hierin liggen worden elke seconde verbruikt en verlagen de kennisschuld. Items zonder waarde blijven liggen. Hogere kwaliteit is meer waard. Open het Kennisschuld-venster (Ctrl+K) voor de waardetabel.

