[technology-description]
rd-consolidation=Trap __1__ van __2__, __4__. Je labs stoppen en ruimen op: prototypes documenteren, recepten echt testen, de aantekeningen ordenen. Elk level ruimt __3__ van de huidige technische schuld op (minimaal een vast bedrag) en verlaagt de onderzoekskosten-multiplier. De multiplier geldt nooit voor dit onderzoek, maar elk level kost meer dan het vorige. De volgende trap ontgrendelen vervangt deze.
rd-consolidation-finite=__1__ levels
rd-consolidation-infinite=oneindig
rd-archive=Ontgrendelt het Referentiearchief, een kist waarin werkende exemplaren van je producten voorgoed worden opgeborgen, zodat de labs ze niet steeds opnieuw hoeven af te leiden. Ruimt technische schuld op; hoe voller het archief, hoe minder elk nieuw monster waard is.

