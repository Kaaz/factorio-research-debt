[mod-name]
research-debt=Kennisschuld

[mod-description]
research-debt=Elke technologie die je erdoorheen jaagt laat technische schuld achter: ongedocumenteerde prototypes, half geteste recepten, losse aantekeningen. Je labs werken eromheen, dus onderzoek wordt duurder. Los het af door je kennis te consolideren, referentiemonsters in een archief op te bergen of iets anders op te geven. Houd je labs schoon en ze draaien sneller.

[mod-setting-name]
rd-preset=Preset
rd-growth-mode=Groeimodus
rd-step=Technische schuld per technologie
rd-tier-scaling=Schuld schalen met science-tier
rd-count-trigger-techs=Trigger-technologieën meetellen
rd-enable-archive=Referentiearchief inschakelen
rd-enable-trades=Ruilopties inschakelen (zorgvuldige modus, labafval, afschrijven)
rd-consolidation-value=Kennisconsolidatie: minimale schuld per level
rd-consolidation-percent=Kennisconsolidatie: aandeel van de schuld per level
rd-max-multiplier=Maximale onderzoekskosten-multiplier
rd-min-multiplier=Minimale multiplier (t.o.v. map-instelling)
rd-debt-free-bonus=Schoon-lab-bonus (labsnelheid bij nul schuld)
rd-penalty-threshold=Labs verzuipen in schuld vanaf (preset Custom)
rd-penalty=Lab-penalty (preset Custom)
rd-request-interval=Interval archiefverzoeken (minuten)
rd-chat-notifications=Chatmeldingen bij schuldwijzigingen
rd-show-hud=Toon onderzoekskosten-HUD

[mod-setting-description]
rd-preset=Relaxed, Standard (afgestemd op ervaren spelers) of Hardcore zetten in één keer de schuld per technologie, kosten en waarde van consolidatie, archief-halfwaardetijd, verzoek-interval, lab-bonus/-penalty en de maximale multiplier. Kies Custom om de losse instellingen te gebruiken; bij een preset worden die genegeerd.
rd-growth-mode=Lineair: multiplier = basis × (1 + schuld). Exponentieel: elke technologie vermenigvuldigt de kosten met (1 + stap).
rd-step=Hoeveel technische schuld elke onderzochte (niet-oneindige) technologie achterlaat. 0,1 betekent +10% onderzoekskosten per technologie in lineaire modus. Wordt genegeerd tenzij de preset Custom is.
rd-tier-scaling=Het hoogste science pack dat een technologie nodig heeft bepaalt hoeveel schuld zij achterlaat: rood ×0,5, groen/militair ×1, blauw ×1,5, paars/geel ×2, ruimte- en planeetpacks ×2,5, cryogeen ×3, promethium ×4. Uit: elke technologie voegt evenveel toe. Wordt genegeerd tenzij de preset Custom is.
rd-count-trigger-techs=Technologieën die door een trigger worden vrijgespeeld (iets maken of delven) hebben geen science-kosten. Toch als schuld meetellen?
rd-enable-archive=Voegt het Referentiearchief toe: een kist waarin werkende exemplaren van je producten worden opgeborgen om technische schuld af te lossen.
rd-enable-trades=Voegt drie extra manieren toe om de multiplier te verlagen in het Kennisschuld-venster: labs in zorgvuldige modus, labafval dumpen, of een technologie afschrijven.
rd-consolidation-value=Alleen bij preset Custom: elk level Kennisconsolidatie verwijdert minimaal zoveel schuld. Wordt genegeerd tenzij de preset Custom is.
rd-consolidation-percent=Alleen bij preset Custom: elk level Kennisconsolidatie verwijdert dit aandeel van de huidige schuld (0,15 = 15%, trap II; de andere trappen schalen mee), nooit minder dan het vaste minimum. Wordt genegeerd tenzij de preset Custom is.
rd-max-multiplier=De onderzoekskosten-multiplier komt nooit boven deze waarde, hoeveel schuld er ook is. Wordt genegeerd tenzij de preset Custom is.
rd-min-multiplier=De multiplier zakt nooit onder basis × deze waarde. 1,0 betekent dat onderzoek nooit goedkoper wordt dan de map-instelling.
rd-debt-free-bonus=Labsnelheid-bonus bij precies nul schuld (0,2 = +20%); de helft daarvan onder 0,5 schuld, een kwart onder 1,0. Wordt genegeerd tenzij de preset Custom is.
rd-penalty-threshold=Alleen bij preset Custom: boven zoveel schuld draaien alle labs trager. Twee treden: hier de penalty, 2,0 schuld hoger de dubbele penalty. 0 schakelt de penalty uit.
rd-penalty=Alleen bij preset Custom: labsnelheid-penalty bij de drempel (0,1 = -10%), verdubbeld 2,0 schuld daarboven.
rd-request-interval=Om de zoveel minuten vraagt het Archief een referentiemonster van een specifiek item dat je nu kunt maken. Opbergen is 3× de normale waarde waard. 0 schakelt verzoeken uit. Wordt genegeerd tenzij de preset Custom is.
rd-chat-notifications=Toon een kort chatbericht bij elke schuldwijziging.
rd-show-hud=Toont de huidige onderzoekskosten-multiplier bovenaan het scherm. Klik erop voor details.

