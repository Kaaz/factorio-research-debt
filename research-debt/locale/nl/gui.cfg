gui-curve-line-top=Labs __1__: helemaal geen technische schuld
gui-curve-tooltip=Labsnelheid volgt de rommel: goed gedocumenteerde kennis laat labs sneller draaien, ongedocumenteerd werk remt ze. Zie de kaart hieronder.
gui-why-title=Waar komt de schuld vandaan?
gui-why-text=Elke technologie die je erdoorheen jaagt laat __1__ technische schuld achter: ongedocumenteerde prototypes, half geteste recepten, aantekeningen overal in de base. Je labs werken eromheen, dus onderzoek kost meer. Ruim de schuld op en de multiplier volgt.
gui-why-text-tiered=Elke technologie die je erdoorheen jaagt laat technische schuld achter: ongedocumenteerde prototypes, half geteste recepten, aantekeningen overal in de base. Hoe geavanceerder de science, hoe groter de rommel (tabel hieronder). Je labs werken eromheen, dus onderzoek kost meer. Ruim de schuld op en de multiplier volgt.
gui-row-techs=Technologieën onderzocht: __1__ × __2__
gui-row-techs-tiered=Technologieën onderzocht: __1__ (schuld hangt af van science-tier)
gui-row-techs-tooltip=Niet-oneindige technologieën die je force (en andere forces: de multiplier is globaal) heeft afgerond.
gui-row-reversed=Technologieën afgeschreven: __1__
gui-row-consolidation=Kennisconsolidatie: __1__ levels
gui-row-archive=Referentiearchief: __1__ monsters opgeborgen
gui-row-trades=Zorgvuldige modus, labafval
gui-row-other=Overige aanpassingen
gui-row-other-tooltip=Herberekeningen, admin-commando’s of scripts.
