gui-how-title=Zo ruim je op
gui-curve-title=[img=item/lab] Schone labs draaien sneller
gui-curve-text=Goed gedocumenteerde kennis houdt je labs op snelheid; boven een drempel verzuipen ze in ongedocumenteerd werk en worden ze trager tot je opruimt. De vette regel is waar je nu zit.
gui-curve-row-zero=Helemaal geen schuld
gui-curve-row-between=Schuld __1__ – __2__
gui-curve-row-above=Schuld boven __1__
gui-cons-title-tier=[img=item/lab] Kennisconsolidatie (trap __1__ van __2__)
gui-cons-none=Nog niet beschikbaar: onderzoek eerst __1__.
gui-cons-text-percent=Je labs stoppen en ruimen op. Elk level ruimt __1__ van de huidige schuld op, minimaal __2__ (nu __3__). Het volgende level afronden brengt de multiplier op __4__. De multiplier geldt nooit voor dit onderzoek, maar elk level kost meer dan het vorige.
gui-cons-milestone-each=Elk level: +__1__ labproductiviteit, permanent. __2__ levels gedaan over alle trappen, nu __3__.
gui-cons-milestone-tooltip=Een ingebouwd effect van de technologie, zichtbaar in het onderzoeksscherm; het spel past het per level toe en neemt het terug als een level wordt afgeschreven.
gui-cons-cost=Volgend level (__1__): __2__ eenheden van __3__
gui-cons-cost-finite=Volgend level (__1__ van __2__): __3__ eenheden van __4__
gui-cons-next-tier=Trap __1__ komt vrij met __2__ en ruimt __3__ per level op; die vervangt deze trap.
gui-cons-next-tier-tooltip=Alleen de hoogste trap die je hebt ontgrendeld is te onderzoeken. Levels van alle trappen tellen samen.
gui-cons-exhausted=Alle __1__ levels van deze trap zijn gedaan; de volgende trap gaat verder.
gui-cons-researching=Wordt opgeruimd… __1__
gui-cons-queued=Staat in de onderzoekswachtrij.
gui-cons-locked=Vergrendeld: onderzoek eerst __1__.
gui-cons-nodebt=Er is nu niets op te ruimen.
gui-cons-available=Beschikbaar.
gui-cons-queue=Toevoegen aan wachtrij
gui-cons-queue-tooltip=Zet één level Kennisconsolidatie in de onderzoekswachtrij van je force.
gui-arch-title=[img=item/rd-archive] Referentiearchief (monsters opbergen)
gui-arch-text=Bouw een Referentiearchief en leg er werkende exemplaren van je producten in. Elke seconde wordt elk item met onderzoekswaarde voorgoed opgeborgen en daalt de schuld; items zonder waarde blijven in de kist. Hogere kwaliteit is meer waard, en hoe voller het archief, hoe minder elk nieuw monster oplevert.
gui-arch-locked=Onderzoek eerst [technology=rd-archive].
gui-arch-none=Nog geen Referentiearchief gebouwd. Maak er een van een stalen kist en 10 elektronische circuits.
gui-arch-count=__1__ Referentiearchief/-archieven actief.
gui-arch-efficiency=Archief neemt monsters aan tegen __1__ (halveert per __2__ opgeborgen punten)
gui-arch-efficiency-tooltip=Elk item heeft een puntwaarde. De waarde van elk extra punt daalt naarmate het totaal aantal punten dat je ooit hebt opgeborgen groeit. Dit is niet te resetten.
gui-arch-example=Op dit moment kost één technologie-stap (__3__ schuld) ongeveer __2__ × [item=__1__].
gui-arch-request=Ontbrekend monster: __1__ × [item=__2__] __3__ tegen __4__× waarde. Opgeborgen __5__ van __1__, nog __6__ min. De rest is ongeveer __7__ schuld waard.
gui-arch-request-none=Geen monster gevraagd op dit moment. Volgend verzoek over ongeveer __1__ min.
gui-arch-request-tooltip=Verzoeken komen uit de waardetabel, alleen items die je nu kunt maken. Items boven het gevraagde aantal tellen tegen normale waarde. Een niet-vervuld verzoek wordt vervangen als het verloopt.
gui-arch-upcoming=Daarna: __1__
gui-arch-upcoming-tooltip=De volgende verzoeken op volgorde. Ze komen uit items die je nu kunt maken; een item dat niet meer te maken is (afgeschreven technologie) wordt overgeslagen als het aan de beurt is.
gui-arch-show-values=Toon waardetabel
gui-arch-hide-values=Verberg waardetabel
gui-arch-col-item=Item
gui-arch-col-value=Schuld per monster (nu)
gui-arch-col-per-step=Monsters per technologie-stap
gui-arch-quality=Kwaliteitsbonus: uncommon ×__1__ … legendary ×__2__.
gui-trade-lab-title=[img=utility/clock] Zorgvuldige modus
gui-trade-lab-text=Laat je labs hun werk dubbel controleren: per stap __1__ trager, en elke stap ruimt __2__ schuld op. Je kunt altijd tegen hetzelfde tarief terugschakelen; je ruilt dus onderzoekstijd voor schonere labs.
gui-trade-lab-status=Labs draaien nu __1__ trager in zorgvuldige modus (__2__ van __3__ stappen). Labsnelheid-modifier: __4__.
gui-trade-lab-slow=Zorgvuldiger −__1__ → −__2__ schuld
gui-trade-lab-restore=Normaal tempo +__1__ → +__2__ schuld
gui-trade-evo-title=[img=entity/biter-spawner] Labafval dumpen
gui-trade-evo-text=Raak de mislukte experimenten op de snelle manier kwijt: verhoog de vijandelijke evolution op je huidige surface met __1__ voor elke __2__ schuld die je opruimt. De biters evolueren erop, en dit is niet terug te draaien.
gui-trade-evo-status=Evolution op __1__: __2__.
gui-trade-evo-max=Evolution is al __1__ of hoger; meer dumpen verandert niets.
gui-trade-evo-none=Er is geen vijandelijke force in dit spel.
gui-trade-evo-button=+__1__ evolution → −__2__ schuld
gui-trade-forget-title=[img=utility/trash] Een technologie afschrijven
gui-trade-forget-text=Gooi de documentatie weg van een technologie waar niets anders van afhangt. Je verliest de recepten en bonussen en krijgt precies de schuld terug die zij achterliet. Wil je haar terug, dan betaal je de volledige kosten opnieuw.
gui-trade-forget-none=Er kan nu niets afgeschreven worden.
gui-trade-forget-button=Geselecteerde technologie afschrijven
gui-trade-nodebt=Er is nu niets op te ruimen.
gui-free-title=Wat schoon blijft
gui-free-text=Oneindige technologieën (mijnproductiviteit, wapenschade, onderzoeksproductiviteit, …) negeren de multiplier volledig en laten nooit schuld achter. Kennisconsolidatie en de Referentiearchief-technologie zijn ook schoon. Technologieën die via een trigger in plaats van science packs worden vrijgespeeld laten ook geen schuld achter (tenzij ingeschakeld in de opstartinstellingen).
