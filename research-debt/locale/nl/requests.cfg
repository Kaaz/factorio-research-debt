[mod-setting-name]
rd-request-interval=Interval archief-verzoeken (minuten)

[mod-setting-description]
rd-request-interval=Om de zoveel minuten vraagt het Archief een specifiek item dat je op dat moment kunt maken. Aanleveren in een willekeurig Archief is 3× de normale waarde waard. 0 schakelt verzoeken uit. Wordt genegeerd tenzij de preset Custom is.

[research-debt]
gui-arch-request=Verzoek: __1__ × [item=__2__] __3__ tegen __4__× waarde. Geleverd __5__ van __1__, nog __6__ min. De rest leveren is ongeveer __7__ schuld waard.
gui-arch-request-none=Geen open verzoek. Volgend verzoek over ongeveer __1__ min.
gui-arch-request-tooltip=Verzoeken komen uit de waardetabel, alleen items die je nu kunt maken. Items boven het gevraagde aantal tellen tegen normale waarde. Een niet-vervuld verzoek wordt vervangen als het verloopt.
msg-request-new=[color=orange][Kennisschuld][/color] Het Archief vraagt __1__ × __2__ __3__ tegen __4__× waarde, de komende __5__ minuten.
msg-request-done=[color=green][Kennisschuld][/color] Verzoek vervuld: __1__ × __2__ __3__ gearchiveerd tegen bonuswaarde.
gui-arch-upcoming=Daarna: __1__
gui-arch-upcoming-tooltip=De volgende verzoeken op volgorde. Ze komen uit items die je nu kunt maken; een item dat niet meer te maken is (vergeten technologie) wordt overgeslagen als het aan de beurt is.
