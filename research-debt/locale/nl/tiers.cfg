[mod-setting-name]
rd-tier-scaling=Schuld schalen met science-tier
rd-debt-free-bonus=Schuldenvrij-bonus labsnelheid

[mod-setting-description]
rd-tier-scaling=Het hoogste science pack dat een technologie nodig heeft bepaalt hoeveel schuld zij toevoegt: rood ×0,5, groen/militair ×1, blauw ×1,5, paars/geel ×2, ruimte- en planeetpacks ×2,5, cryogeen ×3, promethium ×4 (maal de schuld per technologie). Uit: elke technologie voegt evenveel toe.
rd-debt-free-bonus=Zolang de schuld precies nul is draaien de labs van elke force zoveel sneller (0,2 = +20%). 0 schakelt de bonus uit.
