[research-debt]
cmd-gui=Open or close the Research Debt window.
msg-queued=[color=green][Research Debt][/color] Knowledge Consolidation added to the research queue.
msg-queue-failed=[color=red][Research Debt][/color] Could not queue Knowledge Consolidation (queue full or not available).
hud-caption=[img=item/lab] Research __1__
hud-tooltip=[font=default-bold]Research Debt[/font]\nDebt: __1__ from __2__ technologies.\nNext technology → __3__\n\n[color=yellow]Click[/color] or press [font=default-bold]Ctrl+K[/font] for details and ways to lower it.
gui-title=Research Debt
gui-current-cost=Current research cost multiplier
gui-multiplier-tooltip=All non-infinite technologies cost this many times their normal science packs right now.
gui-formula-linear=map setting ×__1__ × (1 + debt __2__) = __3__
gui-formula-exponential=map setting ×__1__ × __2__ ^ __3__ technologies = __4__
gui-clamped=Clamped by settings to the range __1__ … __2__.
gui-next-tech=The next technology adds __1__ debt → __2__
gui-next-tech-tooltip=Every non-infinite technology you finish adds the same amount of debt. Infinite technologies and the technologies of this mod are free.
gui-why-title=Why is it this high?
gui-why-text=Each researched technology adds __1__ debt. Debt can be paid back; the multiplier always follows the total.
gui-row-techs=Technologies researched: __1__ × __2__
gui-row-techs-tooltip=Non-infinite technologies finished by your force (and other forces: the multiplier is global).
gui-row-reversed=Technologies forgotten: __1__
gui-row-consolidation=Knowledge Consolidation: __1__ levels
gui-row-archive=Archive: __1__ items sacrificed
gui-row-other=Other adjustments
gui-row-other-tooltip=Recalculations, admin commands or scripts.
gui-row-total=Total debt
gui-how-title=How to lower it
gui-cons-title=[img=item/lab] Knowledge Consolidation (infinite research)
gui-cons-missing=The Knowledge Consolidation technology is missing from this game.
gui-cons-text=Each level removes __1__ debt. Finishing the next level would bring the multiplier to __2__. This research is never made more expensive by the multiplier, but each level costs 1.5× the previous one.
gui-cons-cost=Next level (__1__): __2__ units of __3__
gui-cons-researching=Researching… __1__
gui-cons-queued=In the research queue.
gui-cons-locked=Locked: research __1__ first.
gui-cons-nodebt=No debt to pay off right now.
gui-cons-available=Available.
gui-cons-queue=Add to research queue
gui-cons-queue-tooltip=Queues one level of Knowledge Consolidation for your force.
gui-arch-title=[img=item/rd-archive] Archive (sacrifice items)
gui-arch-text=Build an Archive and put valuable items in it. Once per second every item with a value is consumed and the debt drops. Items without value stay in the chest. Higher quality items are worth more, and the more you have archived in total, the less each item is worth.
gui-arch-locked=Research [technology=rd-archive] first.
gui-arch-none=No Archive built yet. Craft one from a steel chest and 10 electronic circuits.
gui-arch-count=__1__ Archive(s) active.
gui-arch-efficiency=Current efficiency: __1__ (halves every __2__ points archived)
gui-arch-efficiency-tooltip=Every item has a point value. The value of each additional point falls as the total number of points you have ever archived grows. There is no way to reset this.
gui-arch-example=Right now one technology step (__3__ debt) costs about __2__ × [item=__1__].
gui-arch-show-values=Show value table
gui-arch-hide-values=Hide value table
gui-arch-col-item=Item
gui-arch-col-value=Debt per item (now)
gui-arch-col-per-step=Items per technology step
gui-arch-quality=Quality bonus: uncommon ×__1__ … legendary ×__2__.
gui-free-title=What is never affected
gui-free-text=Infinite technologies (mining productivity, weapon damage, research productivity, …) ignore the multiplier completely and never add debt. Knowledge Consolidation and the Archive technology are also free. Technologies unlocked by a trigger instead of science packs do not add debt either (unless enabled in the startup settings).
gui-log-title=Recent changes
gui-show=Show
gui-hide=Hide
gui-log-empty=Nothing has happened yet.
gui-log-research=Researched __1__ → __2__
gui-log-reversed=Forgot __1__ → __2__
gui-log-consolidation=Knowledge Consolidation → __1__
gui-log-archive=Archive: __1__ → __2__
gui-log-other=__1__ → __2__
gui-settings-hint=Settings: __1__ growth, __2__ debt per technology, maximum __3__.
gui-settings-hint-tooltip=Change these in Settings → Mod settings. Growth mode and debt per technology are startup settings; the maximum is a map setting.
gui-hud-toggle=Show the research cost button at the top of the screen
gui-hud-toggle-tooltip=Also available as a per-player mod setting (Research cost HUD).
gui-lab-open=Details (Ctrl+K)
gui-lab-mult=Research cost __1__
gui-lab-line1=Debt __1__ from __2__ technologies.
gui-lab-line2=Next technology → __1__
gui-next-tech-current=Finishing __1__ adds __2__ debt → __3__
gui-next-tech-range=The next technology adds __1__ (red) to __2__ (highest tier) debt → __3__ … __4__
gui-bonus-active=Debt-free bonus active: labs +__1__
gui-bonus-inactive=Pay off the remaining __2__ debt for +__1__ lab speed
gui-bonus-tooltip=While the debt is exactly zero, all labs run faster. Any new technology ends the bonus until the debt is paid off again.
gui-row-techs-tiered=Technologies researched: __1__ (debt depends on science tier)
gui-tier-row=Tier __1__: __2__
gui-tier-tooltip=The highest science pack a technology needs decides its tier. Debt added per technology of that tier is shown on the right.
gui-bonus-title=[img=item/lab] Debt-free bonus
gui-bonus-text-active=Your debt is zero: all labs run +__1__ faster. The bonus stops as soon as a technology adds debt again.
gui-bonus-text-inactive=Pay off everything and all labs run +__1__ faster for as long as the debt stays at zero. Remaining: __2__ debt.
hud-tooltip-bonus=[font=default-bold]Research Debt[/font]\nDebt: __1__ from __2__ technologies.\n[color=green]Debt-free bonus active: labs +__3__[/color]\n\n[color=yellow]Click[/color] or press [font=default-bold]Ctrl+K[/font] for details.
msg-bonus-on=[color=green][Research Debt][/color] Debt paid off: all labs now run +__1__ faster.
msg-bonus-off=[color=orange][Research Debt][/color] New debt: the +__1__ lab speed bonus is gone until the debt is paid off again.
gui-why-text-tiered=Each researched technology adds debt depending on its science tier (table below). Debt can be paid back; the multiplier always follows the total.
