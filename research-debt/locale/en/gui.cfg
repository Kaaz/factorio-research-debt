hud-caption=[img=item/lab] Research __1__
hud-tooltip=[font=default-bold]Research Debt[/font]\nTechnical debt: __1__ from __2__ technologies.\nNext technology → __3__\n\n[color=yellow]Click[/color] or press [font=default-bold]Ctrl+K[/font] for details and ways to clear it.
hud-tooltip-curve=[font=default-bold]Research Debt[/font]\nTechnical debt: __1__ from __2__ technologies.\nLabs __3__ because of it.\n\n[color=yellow]Click[/color] or press [font=default-bold]Ctrl+K[/font] for details.
gui-title=Research Debt
gui-current-cost=Current research cost multiplier
gui-multiplier-tooltip=All non-infinite technologies cost this many times their normal science packs right now.
gui-formula-linear=map setting ×__1__ × (1 + technical debt __2__) = __3__
gui-formula-exponential=map setting ×__1__ × __2__ ^ __3__ technologies = __4__
gui-clamped=Clamped by settings to the range __1__ … __2__.
gui-next-tech=The next technology leaves __1__ debt → __2__
gui-next-tech-current=Finishing __1__ leaves __2__ debt → __3__
gui-next-tech-range=The next technology leaves __1__ (red) to __2__ (highest tier) debt → __3__ … __4__
gui-next-tech-tooltip=Every non-infinite technology you finish leaves technical debt behind. Infinite technologies and the technologies of this mod are clean.
gui-curve-line=Labs __1__ (next: __2__ after clearing __3__ debt)
gui-curve-line-top=Labs __1__: no technical debt at all
gui-curve-tooltip=Lab speed follows the mess: well-documented knowledge lets labs run faster, undocumented work slows them down. See the card below.
gui-why-title=Where does the debt come from?
gui-why-text=Every technology you rush through leaves __1__ technical debt behind: undocumented prototypes, half-tested recipes, notes all over the base. Your labs work around it, so research costs more. Clear the debt and the multiplier follows.
gui-why-text-tiered=Every technology you rush through leaves technical debt behind: undocumented prototypes, half-tested recipes, notes all over the base. The more advanced the science, the bigger the mess (table below). Your labs work around it, so research costs more. Clear the debt and the multiplier follows.
gui-row-techs=Technologies researched: __1__ × __2__
gui-row-techs-tiered=Technologies researched: __1__ (debt depends on science tier)
gui-row-techs-tooltip=Non-infinite technologies finished by your force (and other forces: the multiplier is global).
gui-row-reversed=Technologies retired: __1__
gui-row-consolidation=Knowledge Consolidation: __1__ levels
gui-row-archive=Reference Archive: __1__ samples filed
gui-row-trades=Careful mode, lab waste
gui-row-other=Other adjustments
gui-row-other-tooltip=Recalculations, admin commands or scripts.
gui-row-total=Total technical debt
gui-tier-row=Tier __1__: __2__
gui-tier-tooltip=The highest science pack a technology needs decides its tier. Debt left per technology of that tier is shown on the right.
gui-how-title=How to clear it
gui-curve-title=[img=item/lab] Clean labs run faster
gui-curve-text=Well-documented knowledge keeps your labs humming; above a threshold they drown in undocumented work and slow down until you clean up. The bold row is where you are now.
gui-curve-row-zero=No debt at all
gui-curve-row-between=Debt __1__ – __2__
gui-curve-row-above=Debt above __1__
gui-cons-title-tier=[img=item/lab] Knowledge Consolidation (tier __1__ of __2__)
gui-cons-none=Not available yet: research __1__ first.
gui-cons-text-percent=Your labs stop and clean up. Each level clears __1__ of the current debt, at least __2__ (right now __3__). Finishing the next level would bring the multiplier to __4__. The multiplier never applies to this research, but each level costs more than the previous one.
gui-cons-milestone-each=Every level: +__1__ lab productivity, permanent. __2__ levels done over all tiers, now __3__.
gui-cons-milestone-tooltip=A built-in effect of the technology, shown in the research screen; the game applies it per level and takes it back if a level is retired.
gui-cons-cost=Next level (__1__): __2__ units of __3__
gui-cons-cost-finite=Next level (__1__ of __2__): __3__ units of __4__
gui-cons-next-tier=Tier __1__ unlocks with __2__ and clears __3__ per level; it replaces this tier.
gui-cons-next-tier-tooltip=Only the highest tier you have unlocked can be researched. Levels of all tiers count together.
gui-cons-exhausted=All __1__ levels of this tier are done; the next tier continues.
gui-cons-researching=Cleaning up… __1__
gui-cons-queued=In the research queue.
gui-cons-locked=Locked: research __1__ first.
gui-cons-nodebt=Nothing to clear right now.
gui-cons-available=Available.
gui-cons-queue=Add to research queue
gui-cons-queue-tooltip=Queues one level of Knowledge Consolidation for your force.
gui-arch-title=[img=item/rd-archive] Reference Archive (file samples)
gui-arch-text=Build a Reference Archive and put working samples of your products in it. Once per second every item with research value is filed away for good and the debt drops; items without value stay in the chest. Higher quality samples are worth more, and the fuller the archive, the less each new sample is worth.
gui-arch-locked=Research [technology=rd-archive] first.
gui-arch-none=No Reference Archive built yet. Craft one from a steel chest and 10 electronic circuits.
gui-arch-count=__1__ Reference Archive(s) active.
gui-arch-efficiency=Archive still accepting samples at __1__ (halves every __2__ points filed)
gui-arch-efficiency-tooltip=Every item has a point value. The value of each additional point falls as the total number of points you have ever filed grows. There is no way to reset this.
gui-arch-example=Right now one technology step (__3__ debt) takes about __2__ × [item=__1__].
gui-arch-request=Missing sample: __1__ × [item=__2__] __3__ at __4__× value. Filed __5__ of __1__, __6__ min left. The rest is worth about __7__ debt.
gui-arch-request-none=No sample requested right now. Next request in about __1__ min.
gui-arch-request-tooltip=Requests are drawn from the value table among items you can craft right now. Items beyond the requested amount count at normal value. An unfulfilled request is replaced when it expires.
gui-arch-upcoming=Up next: __1__
gui-arch-upcoming-tooltip=The next requests in order. They are drawn from items you can craft now; one that becomes uncraftable (a retired technology) is skipped when its turn comes.
gui-arch-show-values=Show value table
gui-arch-hide-values=Hide value table
gui-arch-col-item=Item
gui-arch-col-value=Debt per sample (now)
gui-arch-col-per-step=Samples per technology step
gui-arch-quality=Quality bonus: uncommon ×__1__ … legendary ×__2__.
gui-trade-lab-title=[img=utility/clock] Careful mode
gui-trade-lab-text=Let your labs double-check their work: __1__ slower per step, and every step clears __2__ debt. You can switch back at the same rate at any time, so this trades research time for cleaner labs.
gui-trade-lab-status=Labs currently __1__ slower in careful mode (__2__ of __3__ steps). Lab speed modifier: __4__.
gui-trade-lab-slow=More careful −__1__ → −__2__ debt
gui-trade-lab-restore=Back to normal +__1__ → +__2__ debt
gui-trade-evo-title=[img=entity/biter-spawner] Dump lab waste
gui-trade-evo-text=Get rid of the failed experiments the quick way: raise enemy evolution on your current surface by __1__ for every __2__ debt cleared. The biters evolve on it, and there is no way back.
gui-trade-evo-status=Evolution on __1__: __2__.
gui-trade-evo-max=Evolution is already at or above __1__; dumping more changes nothing.
gui-trade-evo-none=There is no enemy force in this game.
gui-trade-evo-button=+__1__ evolution → −__2__ debt
gui-trade-forget-title=[img=utility/trash] Retire a technology
gui-trade-forget-text=Throw out the documentation of a technology nothing else depends on. You lose its recipes and bonuses and get back exactly the debt it left. Its full cost must be paid again if you want it back.
gui-trade-forget-none=Nothing can be retired right now.
gui-trade-forget-button=Retire selected technology
gui-trade-nodebt=Nothing to clear right now.
gui-free-title=What stays clean
gui-free-text=Infinite technologies (mining productivity, weapon damage, research productivity, …) ignore the multiplier completely and never leave debt. Knowledge Consolidation and the Reference Archive technology are clean as well. Technologies unlocked by a trigger instead of science packs leave no debt either (unless enabled in the startup settings).
