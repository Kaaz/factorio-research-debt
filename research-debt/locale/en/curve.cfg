[mod-setting-description]
rd-preset=Relaxed, Standard (tuned for experienced players) or Hardcore set the debt per technology, consolidation cost and value, archive half-life, request interval, lab bonus/penalty and the maximum multiplier in one go. Choose Custom to use the individual settings instead; with a preset they are ignored.
rd-penalty-threshold=Custom preset only: above this much debt all labs run slower. Two steps: the penalty here, double the penalty 2.0 debt higher. 0 disables the penalty.
rd-penalty=Custom preset only: lab speed penalty at the threshold (0.1 = -10%), doubled 2.0 debt above it.

