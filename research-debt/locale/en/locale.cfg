[mod-name]
research-debt=Research Debt

[mod-description]
research-debt=Every technology you rush through leaves technical debt behind: undocumented prototypes, half-tested recipes, scattered notes. Your labs work around it, so research gets more expensive. Pay it off by consolidating your knowledge, filing reference samples in an archive, or giving something else up. Keep your labs clean and they run faster.

[mod-setting-name]
rd-preset=Preset
rd-growth-mode=Growth mode
rd-step=Technical debt per technology
rd-tier-scaling=Scale debt with science tier
rd-count-trigger-techs=Count trigger technologies
rd-enable-archive=Enable the Reference Archive
rd-enable-trades=Enable trades (careful mode, lab waste, retiring)
rd-consolidation-value=Knowledge Consolidation: minimum debt per level
rd-consolidation-percent=Knowledge Consolidation: share of the debt per level
rd-max-multiplier=Maximum research cost multiplier
rd-min-multiplier=Minimum multiplier (relative to map setting)
rd-debt-free-bonus=Clean-lab bonus (lab speed at zero debt)
rd-penalty-threshold=Labs drown in debt from this much (custom preset)
rd-penalty=Lab penalty (custom preset)
rd-request-interval=Archive request interval (minutes)
rd-chat-notifications=Chat messages on debt changes
rd-show-hud=Show research cost HUD

[mod-setting-description]
rd-preset=Relaxed, Standard (tuned for experienced players) or Hardcore set the debt per technology, consolidation cost and value, archive half-life, request interval, lab bonus/penalty and the maximum multiplier in one go. Choose Custom to use the individual settings instead; with a preset they are ignored.
rd-growth-mode=Linear: multiplier = base × (1 + debt). Exponential: every technology multiplies the cost by (1 + step).
rd-step=How much technical debt each researched (non-infinite) technology leaves behind. 0.1 means +10% research cost per technology in linear mode. Ignored unless the preset is Custom.
rd-tier-scaling=The highest science pack a technology needs decides how much debt it leaves: red ×0.5, green/military ×1, blue ×1.5, purple/yellow ×2, space and planet packs ×2.5, cryogenic ×3, promethium ×4. Off: every technology adds the same amount. Ignored unless the preset is Custom.
rd-count-trigger-techs=Technologies unlocked by a trigger (crafting an item, mining something) have no science cost. Count them as debt anyway?
rd-enable-archive=Adds the Reference Archive: a chest in which working samples of your products are filed away to pay off technical debt.
rd-enable-trades=Adds three more ways to lower the multiplier in the Research Debt window: run your labs in careful mode, dump lab waste, or retire a technology.
rd-consolidation-value=Custom preset only: each Knowledge Consolidation level removes at least this much debt. Ignored unless the preset is Custom.
rd-consolidation-percent=Custom preset only: each Knowledge Consolidation level removes this share of the current debt (0.15 = 15%, tier II; the other tiers scale with it), never less than the fixed minimum. Ignored unless the preset is Custom.
rd-max-multiplier=The research cost multiplier never exceeds this value, no matter how much debt there is. Ignored unless the preset is Custom.
rd-min-multiplier=The multiplier never drops below base × this value. 1.0 means research is never cheaper than the map setting.
rd-debt-free-bonus=Lab speed bonus at exactly zero debt (0.2 = +20%); half of it below 0.5 debt, a quarter below 1.0. Ignored unless the preset is Custom.
rd-penalty-threshold=Custom preset only: above this much debt all labs run slower. Two steps: the penalty here, double the penalty 2.0 debt higher. 0 disables the penalty.
rd-penalty=Custom preset only: lab speed penalty at the threshold (0.1 = -10%), doubled 2.0 debt above it.
rd-request-interval=Every so many minutes the Archive asks for a reference sample of a specific item you can currently craft. Filing it is worth 3× the normal value. 0 disables requests. Ignored unless the preset is Custom.
rd-chat-notifications=Print a short chat message whenever the debt changes.
rd-show-hud=Shows the current research cost multiplier at the top of the screen. Click it for details.

