[mod-name]
research-debt=Research Debt

[mod-description]
research-debt=Every non-infinite technology you research raises a global research cost multiplier. Pay the debt back through Knowledge Consolidation research or by sacrificing items in an Archive.

[mod-setting-name]
rd-growth-mode=Growth mode
rd-step=Debt per technology
rd-count-trigger-techs=Count trigger technologies
rd-enable-archive=Enable the Archive building
rd-consolidation-value=Debt removed per Knowledge Consolidation level
rd-max-multiplier=Maximum research cost multiplier
rd-min-multiplier=Minimum multiplier (relative to map setting)
rd-chat-notifications=Chat notifications on debt changes
rd-show-hud=Show research cost HUD

[mod-setting-description]
rd-growth-mode=Linear: multiplier = base × (1 + debt). Exponential: every technology multiplies the cost by (1 + step).
rd-step=How much debt each researched (non-infinite) technology adds. 0.1 means +10% research cost per technology in linear mode. Ignored unless the preset is Custom.
rd-count-trigger-techs=Technologies unlocked by a trigger (crafting an item, mining something) have no science cost. Count them as debt anyway?
rd-enable-archive=Adds the Archive: a chest that consumes valuable items to pay off research debt.
rd-consolidation-value=Each level of the infinite Knowledge Consolidation research removes this much debt. Ignored unless the preset is Custom.
rd-max-multiplier=The research cost multiplier never exceeds this value, no matter how much debt there is. Ignored unless the preset is Custom.
rd-min-multiplier=The multiplier never drops below base × this value. 1.0 means research is never cheaper than the map setting.
rd-chat-notifications=Print a short chat message whenever debt changes.
rd-show-hud=Shows the current research cost multiplier at the top of the screen. Click it for details.

[mod-setting-string-value]
rd-growth-mode-linear=Linear
rd-growth-mode-exponential=Exponential

[research-debt]
cmd-status=Show research debt, base and current multiplier.
cmd-recalc=(admin) Recalculate debt from the technologies researched so far.
cmd-reset=(admin) Reset research debt to zero.
admin-only=[Research Debt] This command is admin-only.
msg-research=[color=orange][Research Debt][/color] __1__ adds __2__ debt. Research now costs [font=default-bold]×__3__[/font].
msg-consolidation=[color=green][Research Debt][/color] Knowledge Consolidation removed __1__ debt. Research now costs [font=default-bold]×__2__[/font].

[technology-name]
rd-consolidation-green=Knowledge Consolidation I
rd-consolidation-blue=Knowledge Consolidation II
rd-consolidation-yellow=Knowledge Consolidation III
rd-consolidation-space=Knowledge Consolidation IV
rd-archive=Archive

[technology-description]
rd-consolidation=Tier __1__ of __2__, __4__. Re-organise what you already know: each level removes __3__ of the current research debt (at least a fixed minimum) and lowers the research cost multiplier. Never affected by the multiplier itself, but every level costs more than the previous one. Unlocking the next tier replaces this one.
rd-consolidation-finite=__1__ levels
rd-consolidation-infinite=infinite
rd-archive=Unlocks the Archive, a chest that permanently consumes valuable items to pay off research debt. Items lose value the more you have already archived.

[technology-effect]
rd-consolidation=Removes research debt (see the Research Debt window, Ctrl+K)

[entity-name]
rd-archive=Archive

[entity-description]
rd-archive=Items with research value placed in here are consumed once per second and reduce research debt. Items without value are left alone. Higher quality items are worth more. Open the Research Debt window (Ctrl+K) for the value table.

[item-name]
rd-archive=Archive

[item-description]
rd-archive=Consumes valuable items to pay off research debt.

[recipe-name]
rd-archive=Archive

[shortcut-name]
rd-toggle-gui=Research Debt

[shortcut]
rd-toggle-gui=Research Debt

[controls]
rd-toggle-gui=Toggle Research Debt window
