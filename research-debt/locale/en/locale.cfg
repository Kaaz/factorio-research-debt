[technology-description]
rd-consolidation=Tier __1__ of __2__, __4__. Your labs stop and clean up: documenting prototypes, testing recipes properly, sorting the notes. Each level clears __3__ of the current technical debt (at least a fixed minimum) and lowers the research cost multiplier. The multiplier never applies to this research, but every level costs more than the previous one. Unlocking the next tier replaces this one.
rd-consolidation-finite=__1__ levels
rd-consolidation-infinite=infinite
rd-archive=Unlocks the Reference Archive, a chest in which working samples of your products are filed away for good, so the labs can stop re-deriving them. Clears technical debt; the fuller the archive, the less each new sample is worth.

[technology-effect]
rd-consolidation=Clears technical debt (see the Research Debt window, Ctrl+K)

