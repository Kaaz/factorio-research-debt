[mod-setting-name]
rd-enable-trades=Enable trades (lab speed, evolution, forgetting)

[mod-setting-description]
rd-enable-trades=Adds three more ways to lower the multiplier in the Research Debt window: slow down your labs, raise enemy evolution, or forget a technology.

[research-debt]
gui-row-trades=Trades (labs, evolution)
gui-trade-lab-title=[img=utility/clock] Trade time for knowledge
gui-trade-lab-text=Make all labs of your force __1__ slower for every __2__ debt removed. You can undo this at the same rate at any time, so this trades science packs for research time.
gui-trade-lab-status=Labs currently __1__ slower by trade (__2__ of __3__ steps). Lab speed modifier: __4__.
gui-trade-lab-slow=Slow labs −__1__ → −__2__ debt
gui-trade-lab-restore=Restore +__1__ → +__2__ debt
gui-trade-evo-title=[img=entity/biter-spawner] Feed the enemy
gui-trade-evo-text=Raise enemy evolution on your current surface by __1__ for every __2__ debt removed. This cannot be undone.
gui-trade-evo-status=Evolution on __1__: __2__.
gui-trade-evo-max=Evolution is already at or above __1__; no further trades here.
gui-trade-evo-none=There is no enemy force in this game.
gui-trade-evo-button=+__1__ evolution → −__2__ debt
gui-trade-forget-title=[img=utility/trash] Forget a technology
gui-trade-forget-text=Un-research a technology that nothing else depends on. You lose its recipes and bonuses and get back exactly the debt it added (its science tier decides how much). Its full cost must be paid again if you want it back.
gui-trade-forget-none=Nothing can be forgotten right now.
gui-trade-forget-button=Forget selected technology
gui-trade-nodebt=No debt to pay off right now.
gui-log-trade=Trade (__1__) → __2__
msg-trade-lab=[color=green][Research Debt][/color] Labs are now __1__ slower; debt −__2__. Research now costs [font=default-bold]×__3__[/font].
msg-trade-lab-undo=[color=orange][Research Debt][/color] Lab speed restored by __1__; debt +__2__. Research now costs [font=default-bold]×__3__[/font].
msg-trade-evo=[color=green][Research Debt][/color] Evolution on __1__ raised to __2__; debt −__3__. Research now costs [font=default-bold]×__4__[/font].
msg-forget=[color=green][Research Debt][/color] __1__ has been forgotten; debt −__2__. Research now costs [font=default-bold]×__3__[/font].
msg-trade-failed=[color=red][Research Debt][/color] That trade is not possible right now (__1__).
