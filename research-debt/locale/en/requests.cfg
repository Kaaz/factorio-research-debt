[mod-setting-name]
rd-request-interval=Archive request interval (minutes)

[mod-setting-description]
rd-request-interval=Every so many minutes the Archive asks for a specific item that you can currently craft. Delivering it to any Archive is worth 3× the normal value. 0 disables requests. Ignored unless the preset is Custom.

[research-debt]
gui-arch-request=Request: __1__ × [item=__2__] __3__ at __4__× value. Delivered __5__ of __1__, __6__ min left. Remaining delivery is worth about __7__ debt.
gui-arch-request-none=No open request. Next request in about __1__ min.
gui-arch-request-tooltip=Requests are drawn from the value table among items you can craft right now. Items beyond the requested amount count at normal value. An unfulfilled request is replaced when it expires.
msg-request-new=[color=orange][Research Debt][/color] The Archive requests __1__ × __2__ __3__ at __4__× value for the next __5__ minutes.
msg-request-done=[color=green][Research Debt][/color] Request fulfilled: __1__ × __2__ __3__ archived at bonus value.
gui-arch-upcoming=Up next: __1__
gui-arch-upcoming-tooltip=The next requests in order. They are drawn from items you can craft now; one that becomes uncraftable (a forgotten technology) is skipped when its turn comes.
