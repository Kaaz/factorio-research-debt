[mod-setting-name]
rd-tier-scaling=Scale debt with science tier
rd-debt-free-bonus=Debt-free lab speed bonus

[mod-setting-description]
rd-tier-scaling=The highest science pack a technology needs decides how much debt it adds: red ×0.5, green/military ×1, blue ×1.5, purple/yellow ×2, space and planet packs ×2.5, cryogenic ×3, promethium ×4 (times the debt per technology). Off: every technology adds the same amount. Ignored unless the preset is Custom.
rd-debt-free-bonus=While the debt is exactly zero, labs of every force run this much faster (0.2 = +20%). 0 disables the bonus. Ignored unless the preset is Custom.
